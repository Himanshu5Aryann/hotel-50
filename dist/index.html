 as at Hotel Binwa View & Banquets — removes a significant layer of logistics for the hosting family."]}],jC=["All","Weddings","Events","Himachal","Dining","Celebrations","Hospitality"];function SC(){const[n,i]=S.useState("All"),s=n==="All"?Gd:Gd.filter(r=>r.category===n);return c.jsxs("div",{children:[c.jsx(Et,{title:"Journal | Hotel Binwa View & Banquets",description:"Editorial stories on weddings, celebrations, dining and Himachal Pradesh from Hotel Binwa View & Banquets."}),c.jsx(Yt,{image:Le.outdoor,eyebrow:"Journal",title:"Stories From Hotel Binwa View & Banquets.",subtitle:"Editorial notes on weddings, celebrations, dining and life in the Himalayan foothills.",align:"center"}),c.jsx("section",{className:"bg-ivory py-16 sm:py-20",children:c.jsxs("div",{className:"mx-auto max-w-7xl px-6 sm:px-8 lg:px-10",children:[c.jsx("div",{className:"no-scrollbar flex gap-3 overflow-x-auto pb-2",children:jC.map(r=>c.jsx("button",{onClick:()=>i(r),className:jt("shrink-0 rounded-full border px-5 py-2.5 text-xs font-semibold uppercase tracking-wider transition-colors",n===r?"border-rose-dark bg-rose-dark text-ivory":"border-charcoal/15 text-charcoal/70 hover:border-rose-dark hover:text-rose-dark"),children:r},r))}),c.jsx(wn,{className:"mt-12 grid gap-10 sm:grid-cols-2 lg:grid-cols-3",children:s.map(r=>c.jsx(jn,{children:c.jsxs(he,{to:`/blog/${r.slug}`,className:"group block",children:[c.jsx("div",{className:"h-56 overflow-hidden rounded-sm",children:c.jsx("img",{src:r.image,alt:r.title,className:"h-full w-full object-cover transition-transform duration-700 group-hover:scale-105",loading:"lazy"})}),c.jsx("p",{className:"mt-4 text-[11px] font-semibold uppercase tracking-wider text-rose-dark",children:r.category}),c.jsx("p",{className:"mt-2 font-display text-2xl italic leading-snug text-charcoal",children:r.title}),c.jsx("p",{className:"mt-2 text-sm leading-relaxed text-charcoal/60",children:r.excerpt}),c.jsx("span",{className:"mt-3 inline-block text-[11px] font-semibold uppercas
